# Theme the login greeter to match the macOS look.
[greeter]
theme-name=WhiteSur-Light-blue
icon-theme-name=WhiteSur
font-name=Inter 11
background=/usr/share/backgrounds/macos/sonoma.jpg
xft-antialias=true
xft-hintstyle=hintfull
indicators=~spacer;~clock;~spacer;~session;~power
clock-format=%a %e %b  %l:%M %p
