# GRUB configuration baked into the AquaOS ISO.
#
# Load every available video driver and bring up a real graphics mode BEFORE
# handing control to the kernel. This is what makes VirtualBox (and other VBE
# firmware) give us a linear RGB framebuffer instead of leaving us in text
# mode — the cause of the "garbage on screen" symptom.
insmod all_video
insmod gfxterm

set gfxmode=1024x768x32,800x600x32,auto
set gfxpayload=keep
terminal_output gfxterm

set timeout=0
set default=0

menuentry "AquaOS" {
    # The multiboot2 framebuffer request tag in the kernel asks GRUB for a
    # 1024x768x32 RGB framebuffer; GRUB picks the closest mode it can set.
    multiboot2 /boot/kernel.elf
    boot
}
